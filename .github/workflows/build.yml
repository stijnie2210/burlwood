name: Build

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            appimage-arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage-arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -platform linux/${{ matrix.arch }} -tags webkit2_41
      - name: Download appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage-arch }}.AppImage"
          chmod +x appimagetool
      # Only the binary goes in: a bundled libwebkit2gtk would talk to the system's WebKitWebProcess, whose
      # path is compiled in, and crash with "Received invalid message" on any other WebKit version.
      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: ${{ matrix.appimage-arch }}
        run: |
          mkdir -p AppDir/usr/bin
          cp build/bin/burlwood AppDir/usr/bin/burlwood
          cp build/linux/burlwood.desktop AppDir/burlwood.desktop
          cp build/appicon.png AppDir/burlwood.png
          ln -s burlwood.png AppDir/.DirIcon
          ln -s usr/bin/burlwood AppDir/AppRun
          ./appimagetool AppDir burlwood-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: burlwood-linux-${{ matrix.arch }}
          path: burlwood-linux-${{ matrix.arch }}.AppImage
      - uses: softprops/action-gh-release@v3
        with:
          files: burlwood-linux-${{ matrix.arch }}.AppImage

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -platform darwin/universal
      - name: Create DMG
        run: hdiutil create -volname "Burlwood" -srcfolder build/bin/Burlwood.app -ov -format UDZO burlwood-mac-universal.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: burlwood-mac-universal
          path: burlwood-mac-universal.dmg
      - uses: softprops/action-gh-release@v3
        with:
          files: burlwood-mac-universal.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -platform windows/amd64
      - name: Zip binary
        run: Compress-Archive -Path build/bin/burlwood.exe -DestinationPath burlwood-windows-amd64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: burlwood-windows-amd64
          path: burlwood-windows-amd64.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: burlwood-windows-amd64.zip
