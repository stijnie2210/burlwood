name: Build

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -platform linux/amd64 -tags webkit2_41
      - name: Download linuxdeploy
        run: |
          wget -q -O linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy
      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/1024x1024/apps
          cp build/bin/gitgood AppDir/usr/bin/gitgood
          cp build/appicon.png AppDir/usr/share/icons/hicolor/1024x1024/apps/gitgood.png
          cp build/linux/gitgood.desktop AppDir/usr/share/applications/gitgood.desktop
          ./linuxdeploy --appdir AppDir --output appimage
          mv *x86_64.AppImage gitgood-linux-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: gitgood-linux-amd64
          path: gitgood-linux-amd64.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          files: gitgood-linux-amd64.AppImage

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -platform darwin/universal
      - name: Create DMG
        run: hdiutil create -volname "gitgood" -srcfolder build/bin/gitgood.app -ov -format UDZO gitgood-mac-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: gitgood-mac-universal
          path: gitgood-mac-universal.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: gitgood-mac-universal.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -platform windows/amd64
      - name: Zip binary
        run: Compress-Archive -Path build/bin/gitgood.exe -DestinationPath gitgood-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gitgood-windows-amd64
          path: gitgood-windows-amd64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: gitgood-windows-amd64.zip
