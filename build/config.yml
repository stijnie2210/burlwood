# Build configuration for Wails v3.
# After changing `info`, run `wails3 task common:update:build-assets` and review the diff: it overwrites the
# generated files in build/darwin, build/windows and build/linux.
version: '3'

info:
  companyName: "Stijn Mommersteeg"
  productName: "Burlwood"
  # Kept from the Wails v2 builds: macOS ties privacy permissions (such as folder access) to the bundle id.
  productIdentifier: "com.wails.Burlwood"
  description: "A Git client"
  copyright: "© 2026, Stijn Mommersteeg"
  comments: "A Git client"
  version: "0.4.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - website
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
